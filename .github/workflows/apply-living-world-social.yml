name: Apply living world social patch

on:
  push:
    branches:
      - agent/living-guild-raid-npc-whispers
    paths:
      - scripts/apply_living_world_social_patch.py
      - .github/workflows/apply-living-world-social.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/living-guild-raid-npc-whispers

      - name: Normalize merged config marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('conf/mod_npcchat.conf.dist')
          s = p.read_text(encoding='utf-8')
          old = '# PLAYERBOT LFG  -  "LFM heals" in General finds a matching nearby bot who answers (via whisper)'
          if old not in s:
              raise SystemExit('Expected PLAYERBOT LFG header not found')
          p.write_text(s.replace(old, '# PLAYERBOT LFG', 1), encoding='utf-8')
          PY

      - name: Apply focused social patch
        run: python scripts/apply_living_world_social_patch.py

      - name: Commit source update
        shell: bash
        run: |
          if git diff --quiet -- src/mod_npcchat.cpp conf/mod_npcchat.conf.dist; then
            echo "No source/config changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mod_npcchat.cpp conf/mod_npcchat.conf.dist
          git commit -m "Add living guild raid chat and history NPC whispers"
          git push origin HEAD:agent/living-guild-raid-npc-whispers
