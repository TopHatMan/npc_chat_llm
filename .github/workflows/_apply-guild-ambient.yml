name: Apply guild ambient tuning patch

on:
  push:
    branches:
      - agent/tune-whispers-and-guild-chatter
    paths:
      - scripts/_apply_guild_ambient_patch.py
      - .github/workflows/_apply-guild-ambient.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tune-whispers-and-guild-chatter
          fetch-depth: 0

      - name: Apply source patch
        run: python scripts/_apply_guild_ambient_patch.py

      - name: Validate source/config invariants
        run: |
          python scripts/validate_config_contract.py
          python - <<'PY'
          from pathlib import Path
          cpp = Path('src/mod_npcchat.cpp').read_text()
          conf = Path('conf/mod_npcchat.conf.dist').read_text()
          checks = {
              '[worldserver] header preserved': conf.startswith('[worldserver]\n'),
              'quieter whisper chance': 'NpcChat.HistoryWhispers.ChancePct = 5' in conf and 'g_HistoryWhispersChancePct = 5;' in cpp,
              'longer whisper player cooldown': 'NpcChat.HistoryWhispers.PlayerCooldownSec = 600' in conf,
              'guild ambient source': 'MaybeStartGuildAmbientChat(player);' in cpp,
              'guild ambient background lane': '"guild-ambient"' in cpp,
              'guild ambient no immediate login chatter': 'never chatter immediately just because a player logged in' in cpp,
              'random-only multi-speaker fix': 'randomOnlyPool' in cpp,
              'direct guild broadcast remains non-recursive': 'BroadcastToGuild' in cpp,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('OK   ' if ok else 'FAIL ') + name)
          if failed:
              raise SystemExit('failed guild ambient invariants: ' + ', '.join(failed))
          PY
          git diff --check

      - name: Commit generated source
        run: |
          git config user.name "TopHatMan"
          git config user.email "36683809+TopHatMan@users.noreply.github.com"
          git add src/mod_npcchat.cpp
          if git diff --cached --quiet; then
            echo "No generated source changes"
            exit 0
          fi
          git commit -m "Add low-frequency autonomous guild chatter"
          git push origin HEAD:agent/tune-whispers-and-guild-chatter
