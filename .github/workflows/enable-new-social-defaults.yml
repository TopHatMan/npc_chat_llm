name: Enable new social defaults

on:
  push:
    branches:
      - agent/living-guild-raid-npc-whispers
    paths:
      - scripts/enable_new_social_defaults.py
      - .github/workflows/enable-new-social-defaults.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/living-guild-raid-npc-whispers
      - run: python scripts/enable_new_social_defaults.py
      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet -- src/mod_npcchat.cpp; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mod_npcchat.cpp
          git commit -m "Enable new social features by default"
          git push origin HEAD:agent/living-guild-raid-npc-whispers
