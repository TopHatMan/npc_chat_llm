name: Apply NPC chat config runtime fix

on:
  push:
    branches:
      - agent/fix-npcchat-config-runtime
    paths:
      - .github/workflows/apply-config-runtime-fix.yml
      - scripts/apply_config_runtime_fix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-npcchat-config-runtime
      - name: Apply patch
        run: |
          sed -i 's/GuildPresenceNextScanByGuild()/GuildPresenceNextScan()/g' scripts/apply_config_runtime_fix.py
          python scripts/apply_config_runtime_fix.py
      - name: Validate and commit
        run: |
          git config user.name "TopHatMan"
          git config user.email "36683809+TopHatMan@users.noreply.github.com"
          git add src/mod_npcchat.cpp conf/mod_npcchat.conf.dist README.md
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix NPC Chat runtime config loading and diagnostics"
          git push origin HEAD:agent/fix-npcchat-config-runtime
