name: Finalize NPC chat config runtime fix

on:
  push:
    branches:
      - agent/fix-npcchat-config-runtime
    paths:
      - .github/workflows/apply-config-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-npcchat-config-runtime
      - name: Silence remaining defaultable hot-path options
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/mod_npcchat.cpp')
          text = path.read_text()
          replacements = {
              '''cfg.characterCardsPath = sConfigMgr->GetOption<std::string>(\n            "NpcChat.Bot.CharacterCardsPath", "./characters");''':
              '''cfg.characterCardsPath = sConfigMgr->GetOption<std::string>(\n            "NpcChat.Bot.CharacterCardsPath", "./characters", false);''',
              '''cfg.maxLoginsPerScan = sConfigMgr->GetOption<uint32>(\n            "NpcChat.Bot.GuildPresence.MaxLoginsPerScan", 20);''':
              '''cfg.maxLoginsPerScan = sConfigMgr->GetOption<uint32>(\n            "NpcChat.Bot.GuildPresence.MaxLoginsPerScan", 20, false);''',
              '''cfg.includeAddClass = sConfigMgr->GetOption<bool>(\n            "NpcChat.Bot.GuildPresence.IncludeAddClass", true);''':
              '''cfg.includeAddClass = sConfigMgr->GetOption<bool>(\n            "NpcChat.Bot.GuildPresence.IncludeAddClass", true, false);''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('expected hot-path option anchor not found: ' + old.splitlines()[-1])
              text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Commit tweak
        run: |
          git config user.name "TopHatMan"
          git config user.email "36683809+TopHatMan@users.noreply.github.com"
          git add src/mod_npcchat.cpp
          git diff --cached --check
          git commit -m "Silence defaultable bot config warnings"
          git push origin HEAD:agent/fix-npcchat-config-runtime
