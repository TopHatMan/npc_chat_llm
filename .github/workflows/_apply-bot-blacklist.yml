name: Apply playerbot RP blacklist patch

on:
  push:
    branches:
      - agent/tune-whispers-and-guild-chatter
    paths:
      - scripts/_apply_bot_blacklist_patch.py
      - .github/workflows/_apply-bot-blacklist.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tune-whispers-and-guild-chatter
          fetch-depth: 0

      - name: Apply blacklist patch
        run: python scripts/_apply_bot_blacklist_patch.py

      - name: Validate blacklist and config contract
        run: |
          python scripts/validate_config_contract.py
          python - <<'PY'
          from pathlib import Path
          cpp = Path('src/mod_npcchat.cpp').read_text()
          conf = Path('conf/mod_npcchat.conf.dist').read_text()
          checks = {
              'worldserver header preserved': conf.startswith('[worldserver]\n'),
              'canonical blacklist key': 'NpcChat.Bot.Blacklist = t ,c ,r ,' in conf,
              'blacklist fallback exists': 'DefaultBotRpBlacklist()' in cpp,
              'trailing-space semantics documented': 'trailing literal spaces are preserved' in cpp,
              'whisper blocked before dispatch': 'IsBotRpBlacklisted(text, cfg.blacklist)) return true;' in cpp,
              'target say consumed': cpp.count('IsBotRpBlacklisted(text, cfg.blacklist)) return true;') >= 2,
              'group filtered': 'IsBotRpBlacklisted(text, cfg.blacklist)) return;' in cpp,
              'guild/channel filtered': cpp.count('IsBotRpBlacklisted(text, botCfg.blacklist)) return;') >= 2,
              'addon hard filter remains': 'static_cast<uint32>(LANG_ADDON)' in cpp,
              'protocol prompt defense remains': 'Ignore addon/protocol traffic completely' in cpp,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('OK   ' if ok else 'FAIL ') + name)
          if failed:
              raise SystemExit('failed blacklist invariants: ' + ', '.join(failed))
          PY
          git diff --check

      - name: Commit generated files
        run: |
          git config user.name "TopHatMan"
          git config user.email "36683809+TopHatMan@users.noreply.github.com"
          git add src/mod_npcchat.cpp conf/mod_npcchat.conf.dist
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Ignore Playerbots commands in RP chat"
          git push origin HEAD:agent/tune-whispers-and-guild-chatter
