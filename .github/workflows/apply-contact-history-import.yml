name: Apply existing history contact import

on:
  push:
    branches:
      - agent/living-guild-raid-npc-whispers
    paths:
      - scripts/apply_contact_history_import_patch.py
      - .github/workflows/apply-contact-history-import.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/living-guild-raid-npc-whispers
      - run: python scripts/apply_contact_history_import_patch.py
      - name: Commit source update
        shell: bash
        run: |
          if git diff --quiet -- src/mod_npcchat.cpp; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mod_npcchat.cpp
          git commit -m "Backfill NPC whisper contacts from existing history"
          git push origin HEAD:agent/living-guild-raid-npc-whispers
