name: Apply guild bot presence patch

on:
  push:
    branches:
      - agent/guild-bot-presence
    paths:
      - scripts/apply_guild_bot_presence.py
      - .github/workflows/apply-guild-bot-presence.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/guild-bot-presence

      - name: Apply guild presence patch
        run: python scripts/apply_guild_bot_presence.py

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet -- src/mod_npcchat.cpp conf/mod_npcchat.conf.dist PLAYERBOT_CHAT.md; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mod_npcchat.cpp conf/mod_npcchat.conf.dist PLAYERBOT_CHAT.md
          git commit -m "Keep guild playerbots online with real guild members"
          git push origin HEAD:agent/guild-bot-presence
