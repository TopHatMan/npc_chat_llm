name: Apply guild token-safety repair

on:
  push:
    branches:
      - agent/remove-autonomous-guild-chatter
    paths:
      - scripts/_apply_remove_guild_ambient.py
      - .github/workflows/_apply-remove-guild-ambient.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-autonomous-guild-chatter
      - name: Apply repair
        run: python3 scripts/_apply_remove_guild_ambient.py
      - name: Validate
        run: |
          python3 scripts/validate_config_contract.py
          python3 - <<'PY'
          from pathlib import Path
          cpp = Path('src/mod_npcchat.cpp').read_text()
          conf = Path('conf/mod_npcchat.conf.dist').read_text()
          assert cpp.count('MaybeStartGuildAmbientChat(') == 1
          assert 'NpcChat.Bot.GuildAmbient.Enable = 0' in conf
          assert 'Guild LLM traffic is player-driven only' in cpp
          assert 'Guild token-safety rule' in Path('PLAYERBOT_CHAT.md').read_text()
          print('Guild token-safety invariants OK')
          PY
          git diff --check
      - name: Commit repair
        run: |
          git config user.name "Nick"
          git config user.email "36683809+TopHatMan@users.noreply.github.com"
          git add src/mod_npcchat.cpp conf/mod_npcchat.conf.dist PLAYERBOT_CHAT.md scripts/validate_config_contract.py
          git commit -m "Make guild LLM chat player-driven only"
          git push origin agent/remove-autonomous-guild-chatter
