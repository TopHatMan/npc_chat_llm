name: Finish party/history repair

on:
  push:
    branches:
      - agent/fix-party-and-scrub-bot-history
    paths:
      - scripts/_finish_party_history_fix.py
      - .github/workflows/_finish-party-history-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-party-and-scrub-bot-history
      - name: Apply final repair patch
        run: python3 scripts/_finish_party_history_fix.py
      - name: Validate final repair
        run: |
          python3 scripts/validate_config_contract.py
          grep -q 'NpcChat_RequestClass::Interactive, "party-direct"' src/mod_npcchat.cpp
          grep -q 'GetMemberGroup(bot->GetGUID())' src/mod_npcchat.cpp
          grep -q 'ScrubAndLoadBotHistoryTail' src/mod_npcchat.cpp
          grep -q '.npcc bot history scrub' src/mod_npcchat.cpp
          git diff --check
      - name: Commit final repair
        run: |
          git config user.name "Nick"
          git config user.email "36683809+TopHatMan@users.noreply.github.com"
          git add src/mod_npcchat.cpp PLAYERBOT_CHAT.md
          git commit -m "Protect direct party replies and align group packets"
          git push origin agent/fix-party-and-scrub-bot-history
