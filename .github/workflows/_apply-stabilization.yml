name: Final NPC Chat stabilization validation

on:
  push:
    branches:
      - agent/stabilize-npcchat-runtime
    paths:
      - .github/workflows/_apply-stabilization.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-npcchat-runtime
          fetch-depth: 0

      - name: Validate config contract
        run: |
          python -m py_compile scripts/validate_config_contract.py
          python scripts/validate_config_contract.py

      - name: Validate stabilization invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          cpp = Path('src/mod_npcchat.cpp').read_text()
          llm = Path('src/npcchat_llm.cpp').read_text()
          hdr = Path('src/npcchat_llm.h').read_text()

          checks = {
              'direct NPC failure is visible': 'NPC Chat could not reply:' in cpp,
              'health command exists': 'NpcChat API health test queued' in cpp,
              'background lane is wired': 'NpcChat_CallBackgroundLLM' in cpp,
              'generation lane is wired': 'NpcChat_CallGenerationLLM' in cpp,
              'direct interactive label exists': '"direct-npc"' in cpp,
              'no old SlotGuard': 'SlotGuard' not in llm,
              'success releases slot': llm.count('Release(requestClass);') >= 2,
              'typed transport result': 'NpcChat_LLMError error' in hdr,
              'transport class exists': 'class NpcChatTransport' in hdr,
              'no silent non-200 return': 'res->status != 200)\n            return ""' not in llm,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('OK   ' if ok else 'FAIL ') + name)
          if failed:
              raise SystemExit('failed stabilization invariants: ' + ', '.join(failed))
          PY

      - name: Diff hygiene
        run: |
          git diff --check origin/main...HEAD
