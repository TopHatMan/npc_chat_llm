name: Tighten NPC Chat stabilization

on:
  push:
    branches:
      - agent/stabilize-npcchat-runtime
    paths:
      - .github/workflows/_apply-stabilization.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stabilize-npcchat-runtime
          fetch-depth: 0

      - name: Replace local slot guard with explicit release
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/npcchat_llm.cpp')
          s = p.read_text()
          old = '''    struct SlotGuard\n    {\n        NpcChatTransport& transport;\n        NpcChat_RequestClass requestClass;\n        ~SlotGuard() { transport.Release(requestClass); }\n    } guard{ *this, requestClass };\n\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one SlotGuard block, found {s.count(old)}')
          s = s.replace(old, '', 1)
          old_success = '''            result.httpStatus = http.status;\n            result.attempts = attempt;\n            RecordSuccess(requestClass);\n            return result;\n'''
          new_success = '''            result.httpStatus = http.status;\n            result.attempts = attempt;\n            Release(requestClass);\n            RecordSuccess(requestClass);\n            return result;\n'''
          if s.count(old_success) != 1:
              raise SystemExit('success release anchor not found exactly once')
          s = s.replace(old_success, new_success, 1)
          old_failure = '''    if (lastFailure.error == NpcChat_LLMError::None)\n        lastFailure = MakeFailure(NpcChat_LLMError::Transport, "request failed without a diagnostic result");\n    RecordFailure(cfg, requestClass, label, lastFailure);\n    return lastFailure;\n'''
          new_failure = '''    if (lastFailure.error == NpcChat_LLMError::None)\n        lastFailure = MakeFailure(NpcChat_LLMError::Transport, "request failed without a diagnostic result");\n    Release(requestClass);\n    RecordFailure(cfg, requestClass, label, lastFailure);\n    return lastFailure;\n'''
          if s.count(old_failure) != 1:
              raise SystemExit('failure release anchor not found exactly once')
          s = s.replace(old_failure, new_failure, 1)
          p.write_text(s)
          PY

      - name: Validate and commit
        run: |
          grep -q 'Release(requestClass);' src/npcchat_llm.cpp
          if grep -q 'SlotGuard' src/npcchat_llm.cpp; then exit 1; fi
          git diff --check
          git config user.name "TopHatMan"
          git config user.email "36683809+TopHatMan@users.noreply.github.com"
          git add src/npcchat_llm.cpp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Make transport slot release explicit"
          git push origin HEAD:agent/stabilize-npcchat-runtime
